name: ci

on:
  pull_request:
  push:

jobs:
  flutter:
    runs-on: ubuntu-latest
    env:
      # 記録時刻のテストは UTC だと 6 件落ちる。後続ステップへ TZ を置いても、
      # その前の flutter test が落ちると実行されない。ジョブの環境をテストプロセスへ渡す。
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # 既存の warning / info はリポジトリに残っている。このジョブは error だけを失敗にする。
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # integration は手元の Supabase / Docker が要る。無い環境では失敗するので外す。
      - name: flutter test
        run: flutter test --concurrency=1 --exclude-tags integration
        env:
          TZ: Asia/Tokyo
