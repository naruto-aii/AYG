name: Publish landing page

on:
  push:
    branches:
      - main
    paths:
      - "docs/index.html"
      - "docs/styles.css"
      - "docs/.nojekyll"
      - "docs/legal/**"
      - ".github/workflows/publish-landing-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-landing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect static site
        run: |
          mkdir -p _site/legal
          cp docs/index.html docs/styles.css docs/.nojekyll _site/
          cp docs/legal/* _site/legal/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
