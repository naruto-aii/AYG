name: Publish Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tool/assemble_pages_site.sh"
      - "games/craft/**"
      - "games/tenshoku/**"
      - "duolingo-web/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One site, one deploy. Do not share this group with a caller workflow or the run deadlocks.
concurrency:
  group: github-pages-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages site
        # 法務、紹介、lingo、craft、tenshoku だけを公開する。Flutter の web ビルドは含めない。
        run: bash tool/assemble_pages_site.sh docs _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
