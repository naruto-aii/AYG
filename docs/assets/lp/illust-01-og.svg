  <rect x="832" y="466" width="80" height="10" rx="5" fill="#14522f"/>
  <text x="952" y="476" fill="#14522f" font-size="14">90g</text>
  <text x="808" y="510" fill="#55635b" font-size="15" font-weight="700">F</text>
  <rect x="832" y="498" width="110" height="10" rx="5" fill="#edf7f0"/>
  <rect x="832" y="498" width="58" height="10" rx="5" fill="#2d7448"/>
  <text x="952" y="508" fill="#14522f" font-size="14">45g</text>
  <text x="808" y="542" fill="#55635b" font-size="15" font-weight="700">C</text>
