<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">
  <title>カロナビのホームで今日あと何kcalかを表示しているイメージ</title>
  <rect width="1200" height="630" fill="#fef9ee"/>
  <circle cx="910" cy="320" r="250" fill="#edf7f0"/>
  <rect x="72" y="168" width="18" height="64" rx="9" fill="#2d7448"/>
