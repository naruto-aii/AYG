  <text x="895" y="202" text-anchor="middle" fill="#14522f" font-size="26" font-weight="700">あと</text>
  <text x="895" y="292" text-anchor="middle" fill="#14522f" font-size="78" font-weight="700">420</text>
  <text x="895" y="332" text-anchor="middle" fill="#2d7448" font-size="22" font-weight="700">kcal</text>
  <path d="M823 412 A72 72 0 0 0 967 412" fill="none" stroke="#e3e8e3" stroke-width="14" stroke-linecap="round"/>
  <path d="M823 412 A72 72 0 0 0 937 354" fill="none" stroke="#2d7448" stroke-width="14" stroke-linecap="round"/>
  <text x="808" y="478" fill="#55635b" font-size="15" font-weight="700">P</text>
