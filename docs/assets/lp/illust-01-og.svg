  <text x="72" y="320" fill="#14522f" font-size="58" font-weight="700">今日、あと何kcalか。</text>
  <text x="72" y="390" fill="#55635b" font-size="26">食事・運動・体重をまとめて、</text>
  <text x="72" y="432" fill="#55635b" font-size="26">毎日の次の一手を短くする。</text>
  <rect x="760" y="54" width="270" height="522" rx="40" fill="#14522f"/>
  <rect x="776" y="70" width="238" height="490" rx="30" fill="#ffffff"/>
