  <rect x="68" y="286" width="504" height="12" rx="6" fill="#edf7f0"/>
  <rect x="68" y="286" width="210" height="12" rx="6" fill="#2d7448"/>
  <text x="68" y="322" fill="#55635b" font-size="16">炭水化物</text>
  <text x="572" y="322" text-anchor="end" fill="#14522f" font-size="16" font-weight="700">180g</text>
  <rect x="68" y="336" width="504" height="12" rx="6" fill="#edf7f0"/>
  <rect x="68" y="336" width="430" height="12" rx="6" fill="#7eae8e"/>
