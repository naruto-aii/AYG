  <text x="68" y="156" fill="#14522f" font-size="28" font-weight="700">あと</text>
  <text x="148" y="164" fill="#14522f" font-size="72" font-weight="700">420</text>
  <text x="372" y="156" fill="#2d7448" font-size="28" font-weight="700">kcal</text>
