<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" font-family="Hiragino Sans, Yu Gothic, Noto Sans JP, WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">
  <title>今日あと何kcalかとタンパク質・脂質・炭水化物の目安が一目で見える画面のイメージ</title>
