<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カロナビ ウィジェット</title>
<!--
  カロナビのホーム画面ウィジェット・ロック画面ウィジェットの採用デザイン（モック）。
  仕様の本文は同じフォルダの README.md。値は README と一致させること。
  画像の撮り直し: mockup.html#home / mockup.html#lock を開くと端末1台だけを表示する。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green900:#14522F;--green800:#1B5E39;--green700:#2D7448;--green600:#3C875A;--green300:#A8D0B8;
  --orange500:#F6892B;--n700:#55635B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#ECEBE6;font-family:"Zen Maru Gothic",-apple-system,sans-serif;padding:24px 16px 48px}
h1{font-size:20px;font-weight:700;color:var(--green900);margin-bottom:4px}
.lead{font-size:13px;color:var(--n700);margin-bottom:16px;line-height:1.6}
.stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.cap{font-size:12px;font-weight:500;color:var(--n700);margin:0 0 8px 4px}

/* 端末（iPhone 16 Pro 393×852pt） */
.phone{width:393px;height:852px;border-radius:56px;padding:12px;background:#111;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:35px;background:#000;border-radius:20px;z-index:5}
.status{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 34px;font:600 16px -apple-system,sans-serif;z-index:4}
.home{background:linear-gradient(160deg,#C8D9CC 0%,#E9E1CF 55%,#D9C6A8 100%)}
.home .status{color:#1b1b1b}
.homegrid{position:absolute;top:66px;left:0;right:0;padding:0 27.5px}
.apps{display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;row-gap:26px;margin-top:22px}
.app{width:60px;height:60px;border-radius:14px;background:rgba(255,255,255,.55)}
.dock{position:absolute;bottom:14px;left:14px;right:14px;height:86px;border-radius:32px;background:rgba(255,255,255,.35);display:flex;justify-content:space-around;align-items:center;padding:0 12px}
.dock .app{background:rgba(255,255,255,.7)}
.lock .status{color:#fff}
.lockdate{position:absolute;top:70px;width:100%;text-align:center;color:rgba(255,255,255,.85);font:600 19px -apple-system,sans-serif}
.locktime{position:absolute;top:92px;width:100%;text-align:center;color:rgba(255,255,255,.9);font:700 96px/1 -apple-system,sans-serif;letter-spacing:-2px}
.lockwidgets{position:absolute;top:214px;left:0;right:0;display:flex;justify-content:center;gap:14px}
.sq{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14)}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#fff}

/* 壁紙 */
.wp-dark{background:radial-gradient(120% 80% at 30% 10%,#3D6B55 0%,#1E3B2E 45%,#0E1C16 100%)}
.wp-white{background:#FFFFFF}
.wp-photo{background:radial-gradient(40% 25% at 30% 30%,#FFE9A8 0%,transparent 70%),radial-gradient(35% 30% at 75% 28%,#7FB6E8 0%,transparent 70%),radial-gradient(45% 30% at 50% 45%,#F4A29A 0%,transparent 70%),linear-gradient(180deg,#9CC6E8 0%,#E8D3B5 45%,#6E8F5A 70%,#3C4F2E 100%)}
.wp-busy{background:repeating-linear-gradient(45deg,#F7D046 0 14px,#E9475A 14px 28px,#3AA7E0 28px 42px,#FFFFFF 42px 56px)}
.wps{display:flex;gap:6px;margin:0 0 8px 4px;flex-wrap:wrap}
.wps button{font:inherit;font-size:12px;font-weight:700;border:0;border-radius:999px;padding:6px 12px;background:#fff;color:var(--green900);cursor:pointer}
.wps button.on{background:var(--green700);color:#fff}

/* ===== ホーム画面ウィジェット（systemLarge 338×354） ===== */
.wl{width:338px;height:354px;border-radius:24px;overflow:hidden;position:relative;color:#fff;
  padding:18px 18px 16px;display:flex;flex-direction:column;
  background:radial-gradient(140% 90% at 100% 0%,var(--green600) 0%,var(--green800) 45%,var(--green900) 100%)}
.glow{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(168,208,184,.25),transparent 70%)}
.brand{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:rgba(255,255,255,.92)}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--orange500)}
.hero{display:flex;align-items:center;gap:18px;margin-top:12px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{position:absolute;inset:0}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lb{font-size:12px;font-weight:500;color:rgba(255,255,255,.75)}
.ring .num{font-size:36px;font-weight:700;line-height:1.05;letter-spacing:-.04em}
.ring .un{font-size:12px;font-weight:700;color:rgba(255,255,255,.9)}
.stats{flex:1;display:flex;flex-direction:column;gap:10px}
.stats hr{border:0;height:1px;background:rgba(255,255,255,.12)}
.stat{display:flex;align-items:center;gap:10px}
.stat .ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.stat .t{font-size:11px;font-weight:500;color:rgba(255,255,255,.65);line-height:1.3}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .v small{font-size:11px;margin-left:2px;letter-spacing:0}
.sec{font-size:11px;font-weight:500;color:rgba(255,255,255,.6);margin:auto 2px 8px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{height:76px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:0 1px}
.tile .pl{width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.tile span{font-size:10px;font-weight:700;white-space:nowrap;letter-spacing:-.04em}

/* ===== ロック画面ウィジェット（accessoryRectangular 160×72） ===== */
.lw{width:160px;height:72px;color:#fff;border-radius:14px;padding:6px 7px 7px;display:flex;flex-direction:column;justify-content:space-between;
  background:rgba(0,0,0,.32);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.lw .top{display:flex;align-items:baseline;gap:4px;height:32px;padding-left:2px}
.lw .k,.lw .u{font-size:12px;font-weight:700}
.lw .bn{font-size:31px;font-weight:700;letter-spacing:-.04em;line-height:1}
.lw .caps{display:flex;gap:5px}
.lw .caps div{flex:1;height:26px;border-radius:999px;background:#fff;color:rgba(30,30,30,.82);display:flex;align-items:center;justify-content:center;gap:1px;font-size:15px;font-weight:700}

.cmp{margin-top:28px}
.cmp h2{font-size:16px;font-weight:700;color:var(--green900);margin-bottom:12px}
.cmpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:820px}
.sw{height:150px;border-radius:20px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.sw .z{transform:scale(1.5)}
.sw .tag{position:absolute;top:10px;left:12px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:var(--green900)}

/* 撮影用（#home / #lock） */
body.shot{padding:0;background:transparent}
body.shot h1,body.shot .lead,body.shot .cap,body.shot .wps,body.shot .cmp{display:none}
body.shot-home #lockCol,body.shot-lock #homeCol{display:none}
</style>
</head>
<body>
<h1>カロナビ ウィジェット（採用デザイン）</h1>
<p class="lead">iPhone 16 Pro（393×852pt）の実寸です。ホーム画面は大サイズ 338×354、ロック画面は横長 160×72。仕様は同じフォルダの README.md を参照してください。</p>

<div class="stage">
  <div id="homeCol">
    <p class="cap">ホーム画面</p>
    <div class="phone"><div class="screen home">
      <div class="island"></div>
      <div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div>
      <div class="homegrid">
        <div id="homeWidget"></div>
        <div class="apps"><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div></div>
      </div>
      <div class="dock"><div class="app"></div><div class="app"></div><div class="app"></div><div class="app"></div></div>
      <div class="homebar" style="background:#1b1b1b"></div>
    </div></div>
  </div>
  <div id="lockCol">
    <p class="cap">ロック画面</p>
    <div class="wps" id="wps"><button data-w="dark" class="on">暗い壁紙</button><button data-w="white">真っ白</button><button data-w="photo">写真</button><button data-w="busy">派手な柄</button></div>
    <div class="phone"><div class="screen lock wp-dark" id="lockScreen">
      <div class="island"></div>
      <div class="status"><span></span><span>●●● ▲ ▮</span></div>
      <div class="lockdate">10月5日 月曜日</div>
      <div class="locktime">9:41</div>
      <div class="lockwidgets"><div id="lockWidget"></div><div class="sq"></div></div>
      <div class="homebar"></div>
    </div></div>
  </div>
</div>

<div class="cmp">
  <h2>ロック画面：壁紙ごとの見え方（1.5倍）</h2>
  <div class="cmpgrid" id="cmpgrid"></div>
</div>

<script>
const plus=(c,s)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
const meal=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-2.5 1.5-4 4-4 8h4"/></svg>`;
const run=`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4.5" r="2"/><path d="M6 21l3.5-6 3 2.5L14 22M9.5 15l1.5-6 4 2 3 3M11 9L7 10.5 5.5 14"/></svg>`;

// 12時から反時計回り。オレンジの点はアプリの CalorieRing と同じ固定の差し色（右上 -38°）で、進捗と連動しない。
function ring(progress){
  const r=58,c=2*Math.PI*r,a=-38*Math.PI/180;
  return `<svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="10"/>
  <circle cx="66" cy="66" r="${r}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-progress)}" transform="translate(132 0) scale(-1 1) rotate(-90 66 66)"/>
  <circle cx="${66+r*Math.cos(a)}" cy="${66+r*Math.sin(a)}" r="6.5" fill="#F6892B"/></svg>`;
}
// ホームのボタンは食事3つ＋運動2つ（LockScreenMealStore.homeButtons の初期ラベル）
const homeLabels=["朝ごはん","昼ごはん","夜ごはん","ウォーキング","ジョギング"];
const homeWidget=`<div class="wl"><div class="glow"></div>
  <div class="brand"><i></i>カロナビ</div>
  <div class="hero">
    <div class="ring">${ring(0.44)}<div class="in"><span class="lb">今日あと</span><span class="num">1,250</span><span class="un">kcal</span></div></div>
    <div class="stats">
      <div class="stat"><div class="ic">${meal}</div><div><div class="t">摂取</div><div class="v">1,170<small>kcal</small></div></div></div>
      <hr>
      <div class="stat"><div class="ic">${run}</div><div><div class="t">消費</div><div class="v">320<small>kcal</small></div></div></div>
    </div>
  </div>
  <div class="sec">タップで記録</div>
  <div class="tiles">${homeLabels.map(l=>`<div class="tile"><div class="pl">${plus('#1B5E39',14)}</div><span>${l}</span></div>`).join('')}</div>
</div>`;
const ink='rgba(30,30,30,.82)';
const lockWidget=`<div class="lw">
  <div class="top"><span class="k">あと</span><span class="bn">1,250</span><span class="u">kcal</span></div>
  <div class="caps">${['朝','昼','夜'].map(l=>`<div>${plus(ink,12)}${l}</div>`).join('')}</div>
</div>`;

document.getElementById('homeWidget').innerHTML=homeWidget;
document.getElementById('lockWidget').innerHTML=lockWidget;
document.getElementById('cmpgrid').innerHTML=[['dark','暗い壁紙'],['white','真っ白な壁紙'],['photo','写真の壁紙'],['busy','派手な柄']]
  .map(w=>`<div class="sw wp-${w[0]}"><span class="tag">${w[1]}</span><div class="z">${lockWidget}</div></div>`).join('');
document.getElementById('wps').addEventListener('click',e=>{const w=e.target.dataset.w;if(!w)return;
  document.querySelectorAll('#wps button').forEach(b=>b.classList.toggle('on',b.dataset.w===w));
  document.getElementById('lockScreen').className='screen lock wp-'+w;});
const shot=location.hash.slice(1);
if(shot==='home'||shot==='lock')document.body.classList.add('shot','shot-'+shot);
</script>
</body>
</html>
