<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VP音声通話</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <section class="stage-wrap" id="stage" data-state="idle">
        <canvas id="avatar" aria-label="VP"></canvas>
        <p id="aizuchi" class="aizuchi" hidden>うん</p>
        <p id="status" class="status">打ち合わせの前</p>
      </section>
      <section class="panel">
        <header class="heading">
          <p class="kicker">試作 · 本番には出していない</p>
          <h1>VP音声通話</h1>
          <p class="voice" id="voice-name">ブラウザの日本語の女性寄りの声</p>
        </header>
        <p id="banner" class="banner" hidden></p>
        <div class="meters">
          <div>
            <p class="label">経過</p>
            <p id="clock" class="figure">00:00</p>
          </div>
          <div>
            <p class="label">概算費用 / 10円</p>
            <p id="yen" class="figure">0.00円</p>
          </div>
        </div>
        <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
        <p id="tokens" class="tokens">入力 0 / 出力 0</p>
        <p id="saving" class="saving" hidden>節約モード。返事を短くし、ファイルは開きません。</p>
        <label class="model">
          モデル
          <select id="model">
            <option value="claude-haiku-5-5" selected>Haiku（標準）</option>
            <option value="claude-haiku-4-5">Haiku 4.5</option>
            <option value="claude-sonnet-5-5">Sonnet</option>
            <option value="claude-sonnet-4-6">Sonnet 4.6</option>
          </select>
        </label>
        <p id="estimate" class="estimate"></p>
        <div class="actions">
          <button id="start" type="button">打ち合わせを始める</button>
          <button id="mic" type="button" disabled aria-pressed="false">話す</button>
          <button id="end" type="button" class="ghost" disabled>打ち合わせを終わる</button>
        </div>
        <p id="caption" class="caption">字幕はここに出ます。</p>
        <div id="log" class="log" aria-live="polite"></div>
        <form class="composer" id="composer-form">
          <input id="composer" type="text" placeholder="音声が使えないときは、ここに書いて送る" autocomplete="off" />
          <button id="send" type="button">送る</button>
        </form>
        <section id="draft" class="draft" hidden>
          <h2>Cursorへの依頼</h2>
          <p>依頼はこの内容でいい？</p>
          <textarea id="draft-text" rows="5"></textarea>
          <p id="phrase-state">声で「それでいい」を確認するまで送れません</p>
          <button id="approve" type="button">この内容で承認する</button>
        </section>
        <ul id="agents" class="agents"></ul>
        <section id="minutes" class="minutes" hidden>
          <h2>議事録</h2>
          <div id="minutes-body"></div>
          <button id="download" type="button">ダウンロード</button>
        </section>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
